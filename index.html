<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学院就业信息查询</title>
  <!-- Tailwind CSS（CDN，无需构建） -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Fuse.js 模糊搜索库（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/fuse.js@7.0.0/dist/fuse.min.js"></script>
  <style>
    /* 让长标题优雅换行 */
    .clamp-2 {
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
  </style>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div class="max-w-3xl mx-auto px-4 py-8">

    <!-- 头部 -->
    <header class="text-center mb-8">
      <h1 class="text-2xl sm:text-3xl font-bold text-slate-900">学院就业信息查询</h1>
      <p class="mt-2 text-sm text-slate-500">输入企业名称，快速查找相关招聘推文</p>
    </header>

    <!-- 搜索框 -->
    <div class="relative mb-6">
      <input
        id="searchInput"
        type="text"
        placeholder="输入企业名称，如：国家电网、华能……"
        autocomplete="off"
        class="w-full rounded-xl border border-slate-300 bg-white px-5 py-3 pl-12 text-base shadow-sm focus:border-blue-500 focus:outline-none focus:ring-2 focus:ring-blue-200"
      />
      <svg class="absolute left-4 top-1/2 -translate-y-1/2 h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z" />
      </svg>
    </div>

    <!-- 分类筛选 -->
    <div id="categoryFilter" class="flex flex-wrap gap-2 mb-6"></div>

    <!-- 统计信息 -->
    <div id="statusBar" class="mb-4 text-sm text-slate-500"></div>

    <!-- 结果列表 -->
    <div id="resultList" class="space-y-3"></div>

    <!-- 页脚 -->
    <footer class="mt-12 text-center text-xs text-slate-400">
      <p id="updatedInfo"></p>
      <p class="mt-1">数据来源于学院就业信息群 · 点击卡片跳转微信推文</p>
    </footer>
  </div>

  <script>
    let fuse = null;
    let allJobs = [];
    let activeCategory = "全部";

    const searchInput = document.getElementById("searchInput");
    const resultList = document.getElementById("resultList");
    const statusBar = document.getElementById("statusBar");
    const categoryFilter = document.getElementById("categoryFilter");
    const updatedInfo = document.getElementById("updatedInfo");

    // 加载数据
    async function loadData() {
      try {
        const res = await fetch("data.json?_t=" + Date.now()); // 加时间戳避免缓存
        if (!res.ok) throw new Error("数据加载失败：" + res.status);
        const data = await res.json();
        allJobs = data.jobs || [];

        if (data.updatedAt) {
          updatedInfo.textContent = "最近更新：" + data.updatedAt;
        }

        // 初始化 Fuse.js：按企业名和标题模糊匹配
        fuse = new Fuse(allJobs, {
          keys: [
            { name: "company", weight: 0.7 },
            { name: "title", weight: 0.3 }
          ],
          threshold: 0.4,   // 越小越严格
          ignoreLocation: true,
          minMatchCharLength: 1
        });

        renderCategories();
        render("");
      } catch (err) {
        resultList.innerHTML =
          '<div class="rounded-xl border border-red-200 bg-red-50 p-4 text-sm text-red-600">' +
          "数据加载失败：" + err.message +
          "<br/>提示：请通过本地服务器或部署后访问，直接双击打开可能因浏览器限制无法读取 data.json。" +
          "</div>";
      }
    }

    // 取一条记录的所有标签，兼容两种写法：
    // 字符串 "国企招聘"，或数组 ["国企招聘", "技术岗"]
    function getCategories(job) {
      if (Array.isArray(job.category)) {
        return job.category.filter(Boolean);
      }
      if (job.category) {
        return [job.category];
      }
      return [];
    }

    // 渲染分类按钮
    function renderCategories() {
      const cats = ["全部", ...new Set(allJobs.flatMap(getCategories))];
      categoryFilter.innerHTML = cats.map(cat => {
        const active = cat === activeCategory;
        return `<button data-cat="${cat}" class="cat-btn rounded-full px-4 py-1.5 text-sm border transition
          ${active
            ? "bg-blue-600 text-white border-blue-600"
            : "bg-white text-slate-600 border-slate-300 hover:border-blue-400"}">
          ${cat}</button>`;
      }).join("");

      categoryFilter.querySelectorAll(".cat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          activeCategory = btn.dataset.cat;
          renderCategories();
          render(searchInput.value.trim());
        });
      });
    }

    // 渲染结果
    function render(query) {
      let list;

      if (query) {
        list = fuse.search(query).map(r => r.item);
      } else {
        // 无搜索词时按日期倒序展示全部
        list = [...allJobs].sort((a, b) => (b.date || "").localeCompare(a.date || ""));
      }

      // 分类筛选：记录含有该标签即命中（支持多标签）
      if (activeCategory !== "全部") {
        list = list.filter(j => getCategories(j).includes(activeCategory));
      }

      statusBar.textContent = query
        ? `找到 ${list.length} 条与“${query}”相关的结果`
        : `共 ${list.length} 条招聘信息`;

      if (list.length === 0) {
        resultList.innerHTML =
          '<div class="rounded-xl border border-slate-200 bg-white p-6 text-center text-slate-400">' +
          "没有找到相关企业，换个关键词试试～" +
          "</div>";
        return;
      }

      resultList.innerHTML = list.map(job => `
        <a href="${job.url}" target="_blank" rel="noopener noreferrer"
           class="block rounded-xl border border-slate-200 bg-white p-4 shadow-sm transition hover:border-blue-400 hover:shadow-md">
          <div class="flex items-start justify-between gap-3">
            <div class="min-w-0">
              <h3 class="font-semibold text-slate-900 truncate">${escapeHtml(job.company)}</h3>
              <p class="mt-1 text-sm text-slate-600 clamp-2">${escapeHtml(job.title || "")}</p>
            </div>
            <div class="flex flex-wrap gap-1 justify-end shrink-0">
              ${getCategories(job).map(cat => `<span class="rounded-full bg-blue-50 px-2.5 py-0.5 text-xs text-blue-600">${escapeHtml(cat)}</span>`).join("")}
            </div>
          </div>
          <div class="mt-2 flex items-center gap-1 text-xs text-slate-400">
            <svg class="h-3.5 w-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span>${escapeHtml(job.date || "未标注日期")}</span>
          </div>
        </a>
      `).join("");
    }

    // 防止 XSS
    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 输入即搜索（防抖）
    let timer = null;
    searchInput.addEventListener("input", () => {
      clearTimeout(timer);
      timer = setTimeout(() => render(searchInput.value.trim()), 150);
    });

    loadData();
  </script>
</body>
</html>
